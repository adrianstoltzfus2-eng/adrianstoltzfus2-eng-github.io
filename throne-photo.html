<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="./assets/iron-throne-fire-icon.png?v=1">
  <title>War of Westeros — Choose your house</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IM+Fell+English:ital@1&display=swap">
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#08090b;color:#eee7d7}
    body{font-family:Georgia,serif;user-select:none;-webkit-tap-highlight-color:transparent}
    button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
    #sceneImage{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;animation:sceneFade .65s ease-out both}
    @keyframes sceneFade{from{opacity:0}to{opacity:1}}
    header{position:absolute;z-index:2;top:max(env(safe-area-inset-top),12px);left:0;right:0;padding:12px 16px 20px;text-align:center;pointer-events:none;background:linear-gradient(180deg,rgba(5,7,9,.76),rgba(5,7,9,.28) 68%,transparent);transition:opacity .3s ease,filter .35s ease,transform .35s ease}
    h1{margin:0;font:700 clamp(1.45rem,4.6vw,2.8rem)/1.08 Cinzel,Georgia,serif;letter-spacing:.08em;color:#e7dfce;text-shadow:0 2px 14px #000,0 0 25px #000}
    .rule{width:min(250px,54vw);height:1px;margin:9px auto 7px;background:linear-gradient(90deg,transparent,#c8a86c,transparent);opacity:.8}
    #w{margin:0;font:italic 1.14rem/1.2 "IM Fell English",Georgia,serif;color:#d2c8b6;text-shadow:0 2px 9px #000}
    #hint{display:block;margin-top:7px;font:600 .67rem/1.3 Cinzel,Georgia,serif;letter-spacing:.15em;text-transform:uppercase;color:#c8a86c;text-shadow:0 2px 8px #000}
    #hint.warn{color:#df8c83}
    #confirmHouse{pointer-events:auto;margin:9px auto 0;padding:8px 17px;border:1px solid #c8a86caa;border-radius:999px;background:#0b0d10e8;color:#ebd8ad;font:700 .68rem Cinzel,Georgia,serif;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 4px 18px #0009}
    #confirmHouse[hidden]{display:none}
    .choice-panel{position:absolute;z-index:3;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);transition:opacity .28s ease,translate .28s ease}
    .choice-panel[hidden]{display:none}
    body.mode-switching header{opacity:.35;filter:blur(1px);transform:translateY(5px)}
    body.mode-switching .choice-panel{opacity:0;translate:0 8px}
    .entry-actions{width:min(520px,calc(100vw - 32px));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .entry-button{min-height:82px;padding:13px 16px;border:1px solid #d6b66d99;border-top:2px solid #e7c77c;border-radius:7px;background:linear-gradient(145deg,rgba(17,19,22,.94),rgba(8,9,11,.94));box-shadow:0 8px 28px #000b,inset 0 0 20px #c8a86c0b;text-align:left;cursor:pointer;transition:transform .16s ease,border-color .16s ease,background .16s ease}
    .entry-button:hover,.entry-button:focus-visible{transform:translateY(-3px);border-color:#f1d99f;background:linear-gradient(145deg,rgba(39,34,25,.97),rgba(10,11,13,.97));outline:none}
    .entry-button strong{display:block;color:#f1dfb5;font:700 .86rem Cinzel,Georgia,serif;letter-spacing:.11em}
    .entry-button small{display:block;margin-top:6px;color:#b9b1a2;font-size:.72rem;line-height:1.35}
    .house-panel{width:min(980px,calc(100vw - 36px));padding:10px;border:1px solid #d9be874d;border-radius:9px;background:rgba(8,10,12,.86);box-shadow:0 10px 36px #000b;backdrop-filter:blur(5px)}
    .house-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px}
    .house-option{min-width:0;min-height:119px;padding:7px 4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;border:1px solid #d9be8730;border-radius:6px;background:rgba(255,255,255,.025);cursor:pointer;transition:transform .16s ease,background .16s ease,border-color .16s ease,opacity .16s ease}
    .house-option:hover,.house-option:focus-visible,.house-option.preview{transform:translateY(-3px);background:rgba(200,168,108,.12);border-color:#e3c786;outline:none}
    .house-option.picked{border-color:#f0d597;background:rgba(200,168,108,.17);box-shadow:0 0 15px #c8a86c30}
    .house-option:disabled{cursor:not-allowed;opacity:.46;filter:grayscale(.48)}
    .house-option .banner-art{display:block;width:58px;height:76px;flex:0 0 auto;background-image:url('./assets/house-banners.png?v=1');background-repeat:no-repeat;background-size:400% 200%;background-position:var(--sprite-x,0%) var(--sprite-y,0%);filter:drop-shadow(0 3px 4px #0008)}
    .house-option strong{max-width:100%;overflow:hidden;color:#eee4cf;font:700 .57rem/1.2 Cinzel,Georgia,serif;letter-spacing:.035em;text-overflow:ellipsis;white-space:nowrap}
    .house-option small{display:none;color:#c0b6a2;font-size:.57rem;line-height:1.25;text-align:center}
    .mode-pin-panel{position:absolute;z-index:5;top:50%;left:50%;width:min(340px,calc(100vw - 36px));transform:translate(-50%,-50%);padding:24px 22px 20px;border:1px solid #d9be8770;border-top:2px solid #c8a86c;border-radius:10px;background:rgba(13,15,18,.96);box-shadow:0 16px 50px #000c;text-align:center;color:#eee7d7;font-family:Cinzel,Georgia,serif}
    .mode-pin-panel[hidden]{display:none}
    .mode-pin-panel label{display:block;margin-bottom:10px;color:#c8a86c;font-size:11px;letter-spacing:.19em}
    .mode-pin-panel input{width:100%;padding:10px;background:#101318;border:1px solid #d9be8752;border-radius:5px;color:#f3e3bf;text-align:center;font:700 24px Cinzel,Georgia,serif;letter-spacing:.3em;text-transform:uppercase;outline:none}
    .mode-pin-panel button{margin:12px 4px 0;padding:9px 14px;border:1px solid #d9be8759;border-radius:5px;background:#26241f;color:#ead6a8;font:700 10px Cinzel,Georgia,serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
    #pinError{display:block;min-height:14px;margin-top:9px;color:#df8c83;font:11px/1.4 Georgia,serif}
    body.mobile-device h1{font-size:clamp(1.25rem,6vw,1.8rem)}
    body.mobile-device #w{font-size:1rem}
    body.mobile-device #hint{font-size:.6rem;letter-spacing:.11em}
    @media(max-width:720px){
      .house-panel{width:min(410px,calc(100vw - 22px));max-height:min(58vh,520px);overflow-y:auto;padding:8px}
      .house-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
      .house-option{min-height:78px;padding:5px 8px;display:grid;grid-template-columns:46px minmax(0,1fr);grid-template-rows:1fr 1fr;column-gap:9px;align-items:center;text-align:left}
      .house-option .banner-art{width:43px;height:58px;grid-row:1/3}
      .house-option strong{align-self:end;font-size:.63rem}
      .house-option small{display:block;align-self:start;text-align:left}
      .entry-actions{width:min(430px,calc(100vw - 24px));gap:8px}
      .entry-button{min-height:74px;padding:11px 12px}
      .entry-button strong{font-size:.72rem}
      .entry-button small{font-size:.66rem}
    }
    @media(max-height:600px) and (min-width:721px){
      .house-panel{width:min(760px,calc(100vw - 36px));max-height:49vh;overflow-y:auto}
      .house-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
    }
    @media(prefers-reduced-motion:reduce){#sceneImage{animation:none}header,.choice-panel,.entry-button,.house-option{transition:none}}
  </style>
</head>
<body>
  <img id="sceneImage" src="./assets/throne-photo-background.png?v=1" alt="The Iron Throne in a shadowed stone hall">
  <header>
    <h1 id="n">War of Westeros</h1><div class="rule"></div><p id="w">Choose your path</p>
    <small id="hint">Host a game or join with a PIN</small>
    <button id="confirmHouse" type="button" hidden>Confirm house</button>
  </header>
  <section id="entryActions" class="choice-panel entry-actions" aria-label="Start or join a game">
    <button id="hostButton" class="entry-button" type="button"><strong>HOST GAME</strong><small>Create a new game and invite players.</small></button>
    <button id="joinButton" class="entry-button" type="button"><strong>JOIN GAME</strong><small>Enter a four-character game PIN.</small></button>
  </section>
  <section id="housePanel" class="choice-panel house-panel" aria-label="Choose your house" hidden>
    <div id="houseGrid" class="house-grid" role="group" aria-label="Available houses"></div>
  </section>
  <form id="modePinPanel" class="mode-pin-panel" hidden>
    <label for="modePinInput">ENTER GAME PIN</label>
    <input id="modePinInput" maxlength="4" minlength="4" inputmode="text" autocomplete="one-time-code" required>
    <div><button type="submit">Join the game</button><button id="cancelPin" type="button">Back</button></div>
    <small id="pinError" aria-live="polite"></small>
  </form>
  <script>
    const isPhone=()=>Boolean(navigator.userAgentData?.mobile||/Android|iPhone|iPod|Mobile/i.test(navigator.userAgent)||(matchMedia('(pointer: coarse)').matches&&window.innerWidth<=900));
    document.body.classList.toggle('mobile-device',isPhone());
    const H=[
      {key:'greyjoy',name:'House Greyjoy',motto:'We Do Not Sow',color:'#c9a640'},
      {key:'tyrell',name:'House Tyrell',motto:'Growing Strong',color:'#7fb04f'},
      {key:'lannister',name:'House Lannister',motto:'Hear Me Roar',color:'#d02a42'},
      {key:'stark',name:'House Stark',motto:'Winter Is Coming',color:'#b8c6d2'},
      {key:'baratheon',name:'House Baratheon',motto:'Ours Is the Fury',color:'#f2d13a'},
      {key:'targaryen',name:'House Targaryen',motto:'Fire and Blood',color:'#ff6a2b'},
      {key:'martell',name:'House Martell',motto:'Unbowed, Unbent, Unbroken',color:'#f08a24'},
      {key:'arryn',name:'House Arryn',motto:'As High as Honor',color:'#6aa3e0'}
    ].map(h=>({...h,status:'open',note:''}));
    const HOUSE_SPRITES={
      stark:['0%','0%'],lannister:['33.333%','0%'],baratheon:['66.667%','0%'],targaryen:['100%','0%'],
      tyrell:['0%','100%'],greyjoy:['33.333%','100%'],martell:['66.667%','100%'],arryn:['100%','100%']
    };
    const n=document.getElementById('n'),w=document.getElementById('w'),hint=document.getElementById('hint'),root=document.documentElement;
    const entryActions=document.getElementById('entryActions'),housePanel=document.getElementById('housePanel'),houseGrid=document.getElementById('houseGrid');
    const confirmHouse=document.getElementById('confirmHouse'),modePinPanel=document.getElementById('modePinPanel');
    const modePinInput=document.getElementById('modePinInput'),pinError=document.getElementById('pinError');
    const inFrame=window.parent!==window,normHouse=v=>String(v||'').toLowerCase().replace(/^house\s+/,'').trim();
    let entryMode=new URLSearchParams(location.search).get('mode')==='entry',picked=-1,previewed=-1;
    const setHint=(text,warn=false)=>{hint.textContent=text;hint.classList.toggle('warn',warn)};
    const escapeHtml=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function houseAt(i){return H[i]}
    function renderHouseButtons(){
      houseGrid.innerHTML=H.map((house,i)=>{const pos=HOUSE_SPRITES[house.key]||['0%','0%'];return `<button class="house-option" type="button" data-i="${i}" aria-label="${escapeHtml(house.name)} · ${escapeHtml(house.motto)}"><span class="banner-art" aria-hidden="true" style="--sprite-x:${pos[0]};--sprite-y:${pos[1]}"></span><strong>${escapeHtml(house.name)}</strong><small>${escapeHtml(house.motto)}</small></button>`}).join('');
      bindHouseButtons();
    }
    function show(i){const house=houseAt(i);n.textContent=house.name;w.textContent=house.motto;root.style.setProperty('--c',house.color);if(house.status!=='open')setHint(house.note||'Not available',true);else setHint(house.note||'Choose this house')}
    function reset(){
      if(picked>=0){show(picked);setHint('Sworn. Now give your name…');return}
      if(previewed>=0){show(previewed);setHint('Tap again or confirm your house');confirmHouse.hidden=false;return}
      n.textContent='War of Westeros';w.textContent=entryMode?'Choose your path':'Choose your house';
      setHint(entryMode?'Host a game or join with a PIN':(isPhone()?'Tap a banner to preview':'Choose a banner to swear fealty'));
      root.style.setProperty('--c','#c8a86c');confirmHouse.hidden=true;
    }
    function applyStatus(){document.querySelectorAll('.house-option').forEach(el=>{const i=+el.dataset.i,disabled=entryMode||H[i].status!=='open';el.disabled=disabled;el.classList.toggle('unavailable',disabled);el.classList.toggle('picked',i===picked);el.classList.toggle('preview',i===previewed);el.setAttribute('aria-label',`${H[i].name}${H[i].status!=='open'?` · ${H[i].note||'Not available'}`:''}`)})}
    function syncPanels(){entryActions.hidden=!entryMode;housePanel.hidden=entryMode;confirmHouse.hidden=entryMode||previewed<0;confirmHouse.textContent='Confirm house'}
    function transitionMode(mode){const nextEntry=mode==='entry';if(entryMode===nextEntry)return;document.body.classList.add('mode-switching');setTimeout(()=>{entryMode=nextEntry;picked=-1;previewed=-1;modePinPanel.hidden=true;pinError.textContent='';syncPanels();applyStatus();reset();requestAnimationFrame(()=>document.body.classList.remove('mode-switching'))},160)}
    function pickHouse(i){const house=houseAt(i);if(house.status!=='open'){show(i);setHint(house.note||'Not available',true);return}picked=i;previewed=-1;confirmHouse.hidden=true;applyStatus();show(i);setHint('Sworn. Now give your name…');if(inFrame)window.parent.postMessage({type:'iron-throne:pick',house:house.key,name:house.name},location.origin==='null'?'*':location.origin);else setTimeout(()=>{location.href='./index.html#house='+encodeURIComponent(house.key)},700)}
    function bindHouseButtons(){document.querySelectorAll('.house-option').forEach(el=>{const i=+el.dataset.i;el.addEventListener('pointerenter',()=>show(i));el.addEventListener('pointerleave',reset);el.addEventListener('focus',()=>show(i));el.addEventListener('blur',reset);el.addEventListener('click',()=>{if(H[i].status!=='open'){show(i);return}if(!isPhone()){pickHouse(i);return}if(previewed===i){pickHouse(i);return}previewed=i;applyStatus();show(i);setHint('Tap again or confirm your house');confirmHouse.hidden=false})});applyStatus()}
    document.getElementById('hostButton').addEventListener('click',()=>{setHint('Opening a new game…');if(inFrame)window.parent.postMessage({type:'iron-throne:host'},location.origin==='null'?'*':location.origin)});
    document.getElementById('joinButton').addEventListener('click',()=>{n.textContent='Join a game';w.textContent='Enter the four-character PIN';setHint('Enter the PIN shared by the host');modePinPanel.hidden=false;pinError.textContent='';modePinInput.value='';setTimeout(()=>modePinInput.focus(),30)});
    confirmHouse.addEventListener('click',()=>{if(previewed>=0)pickHouse(previewed)});
    modePinInput.addEventListener('input',()=>{modePinInput.value=modePinInput.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);pinError.textContent=''});
    modePinPanel.addEventListener('submit',event=>{event.preventDefault();const pin=modePinInput.value.trim().toUpperCase();if(pin.length!==4){pinError.textContent='Enter all four characters.';return}if(inFrame)window.parent.postMessage({type:'iron-throne:join-pin',pin},location.origin==='null'?'*':location.origin)});
    document.getElementById('cancelPin').addEventListener('click',()=>{modePinPanel.hidden=true;reset()});
    addEventListener('message',ev=>{if(ev.source!==window.parent||!ev.data)return;
      if(ev.data.type==='iron-throne:set-mode'&&['entry','house'].includes(ev.data.mode))transitionMode(ev.data.mode);
      if(ev.data.type==='iron-throne:mode-error'){const message=String(ev.data.message||'Could not continue.');pinError.textContent=message;setHint(modePinPanel.hidden?message:'Choose an option to try again',true)}
      if(ev.data.type==='iron-throne:houses'&&Array.isArray(ev.data.houses)){for(const item of ev.data.houses){const house=H.find(x=>x.key===normHouse(item.name)||x.key===normHouse(item.id));if(!house)continue;house.id=item.id;if(item.name){const nm=String(item.name).replace(/^house\s+/i,'');house.name='House '+nm.charAt(0).toUpperCase()+nm.slice(1)}if(item.motto)house.motto=String(item.motto);if(/^#[0-9a-f]{3,8}$/i.test(item.color||''))house.color=item.color;house.status=['open','locked','claimed'].includes(item.status)?item.status:'open';house.note=String(item.note||'')}if(previewed>=0&&H[previewed].status!=='open'){previewed=-1;confirmHouse.hidden=true}renderHouseButtons()}
      if(ev.data.type==='iron-throne:reset'){picked=-1;previewed=-1;modePinPanel.hidden=true;syncPanels();applyStatus();reset()}
    });
    renderHouseButtons();syncPanels();reset();
    if(inFrame)window.parent.postMessage({type:'iron-throne:ready'},location.origin==='null'?'*':location.origin);
  </script>
</body>
</html>
