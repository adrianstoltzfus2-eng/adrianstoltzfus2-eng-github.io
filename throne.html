<style>
:root{--c:#aeb4b9;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#07080a;overflow:hidden}
header{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;text-align:center;padding:20px 16px 0;z-index:2;pointer-events:none}
h1{margin:0;font:700 clamp(1.5rem,5.2vw,3rem)/1.1 Cinzel,Georgia,serif;letter-spacing:.08em;color:var(--c);text-shadow:0 0 28px color-mix(in srgb,var(--c) 55%,transparent),0 2px 8px #000;transition:color .35s}
.rule{width:min(260px,50vw);height:2px;margin:12px auto 10px;background:linear-gradient(90deg,transparent,var(--c),transparent)}
p{margin:0;font:italic 1.2rem/1.3 "IM Fell English",Georgia,serif;color:#c4bdb0;text-shadow:0 1px 6px #000;min-height:1.4em}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sw{cursor:pointer;outline:none}.sw.locked{cursor:not-allowed}.sw.locked .in{filter:grayscale(1) brightness(.55)}.sw.locked:hover .in{filter:grayscale(1) brightness(.7) drop-shadow(0 0 6px #6b6f74)}#hint{display:block;margin-top:8px;font:600 .72rem/1.3 Cinzel,Georgia,serif;letter-spacing:.18em;text-transform:uppercase;color:#8d8578;text-shadow:0 1px 6px #000;transition:color .3s}#hint.warn{color:#d58c7f}.sw.picked .in{transform:translateY(-60px);filter:drop-shadow(0 0 16px var(--c))}
.in{transition:transform .5s cubic-bezier(.2,.8,.2,1),filter .35s}
.sw:hover .in,.sw:focus-visible .in,.sw.preview .in{transform:translateY(-30px);filter:drop-shadow(0 0 9px var(--c))}
.sw.mode-inactive{cursor:default;opacity:.42}
.mode-pin-panel{position:absolute;z-index:5;top:50%;left:50%;width:min(340px,calc(100vw - 36px));transform:translate(-50%,-50%);padding:24px 22px 20px;border:1px solid rgba(217,190,135,.42);border-top:2px solid #c8a86c;border-radius:10px;background:rgba(13,15,18,.94);box-shadow:0 16px 50px #000b;text-align:center;color:#eee7d7;font-family:Cinzel,Georgia,serif}
.mode-pin-panel[hidden]{display:none}

.mode-pin-panel input{width:100%;padding:10px;background:#101318;border:1px solid rgba(217,190,135,.32);border-radius:5px;color:#f3e3bf;text-align:center;font:700 24px Cinzel,Georgia,serif;letter-spacing:.3em;text-transform:uppercase;outline:none}
.mode-pin-panel button{margin:12px 4px 0;padding:9px 14px;border:1px solid rgba(217,190,135,.35);border-radius:5px;background:#26241f;color:#ead6a8;font:700 10px Cinzel,Georgia,serif;letter-spacing:.1em;text-transform:uppercase}
#pinError{display:block;min-height:14px;margin-top:9px;color:#df8c83;font:11px/1.4 Georgia,serif}
.fl{animation:fl 2.4s ease-in-out infinite alternate}
@keyframes fl{to{opacity:.6}}
.torch-glow{will-change:opacity;animation:torchGlow 3.6s ease-in-out infinite alternate}
@keyframes torchGlow{from{opacity:.54}to{opacity:.72}}
.fa{will-change:opacity;animation:torchFlame 1.35s ease-in-out infinite alternate}
@keyframes torchFlame{from{opacity:.56}to{opacity:.88}}
#o{pointer-events:none}
.br{animation:br 9s ease-in-out infinite alternate}@keyframes br{from{opacity:.82}to{opacity:1}}
.em{opacity:0;animation:em 3.4s linear infinite}
@keyframes em{0%{transform:translate(0,0) scale(1);opacity:0}12%{opacity:.9}100%{transform:translate(var(--dx),-55px) scale(.2);opacity:0}}
.dm{opacity:0;fill:#dbe8f2;animation:dm 24s linear infinite}
@keyframes dm{0%{transform:translate(0,0);opacity:0}15%{opacity:.85}85%{opacity:.7}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.hz{animation:hz 50s ease-in-out infinite alternate}@keyframes hz{to{transform:translateX(90px)}}
@media(prefers-reduced-motion:reduce){.br,.em,.dm,.hz{animation:none}}
@media(prefers-reduced-motion:reduce){.in{transition:none}.fl{animation:none}}
.tg{transform-box:fill-box;transform-origin:50% 100%;animation:tg 1s ease-in-out infinite alternate}@keyframes tg{0%{transform:scale(1,.88) skewX(-3deg)}50%{transform:scale(.94,1.06) skewX(2deg)}100%{transform:scale(1.04,.94) skewX(-1deg)}}.em2{opacity:0;animation:em2 4s linear infinite}@keyframes em2{0%{transform:translate(0,0) scale(1);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx),-420px) scale(.2);opacity:0}}.wallTorchBloom{opacity:.48;animation:wallFlicker 3.1s ease-in-out infinite alternate;mix-blend-mode:screen}.wallTorchBloom:nth-of-type(2n){animation-delay:-1.2s}@keyframes wallFlicker{0%{opacity:.14}27%{opacity:.24}54%{opacity:.17}78%{opacity:.28}100%{opacity:.19}}.windowWallBloom{opacity:.68;animation:windowPulse 12s ease-in-out infinite alternate}@keyframes windowPulse{to{opacity:.94}}@media(prefers-reduced-motion:reduce){.tg,.em2,.wallTorchBloom,.windowWallBloom,.torch-glow,.fa{animation:none;will-change:auto}}
body.mobile-device header{top:max(env(safe-area-inset-top,0px),12px);padding:12px 10px 0}
body.mobile-device h1{font-size:clamp(1.25rem,6vw,1.8rem)}
body.mobile-device p{font-size:1rem}
body.mobile-device #hint{font-size:.62rem;letter-spacing:.12em;margin-top:6px}
body.mobile-device #confirmHouse{pointer-events:auto;margin:10px auto 0;padding:9px 18px;border:1px solid color-mix(in srgb,var(--c) 70%,#554936);border-radius:999px;background:rgba(13,14,16,.88);color:var(--c);font:700 .68rem Cinzel,Georgia,serif;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 4px 18px #0009}
header,#g,.sw,.mode-pin-panel{transition:opacity .3s ease,filter .35s ease,transform .35s ease}
body.mode-switching header{opacity:.28;filter:blur(1px);transform:translateY(5px)}

<script>

// A sword blade pointing up from (0,0): bevelled facets, fuller, taper, bend and nicks

 if(o.h==null){const k=rnd()<.2;o.h=k?26:212;o.s=k?16:9}
 const N=16,Lf=[],Rt=[],C=[];
 for(let i=0;i<=N;i++){const t=i/N,y=-o.L*t,c=o.b*t*t;

 const dd='M'+pp.map(p=>f(X(p[0]))+' '+f(p[1])).join('L')+'Z';
 for(const t of[.12,.3,.5]){const[bx,by]=Bq(t),a=q*(48+R(80)),e=8+rnd()*20,tx=X(bx)+Math.sin(a*D)*e,ty=by-Math.cos(a*D)*e,L=Math.min(115,(860-ty)/Math.max(.25,Math.cos(a*D)));g2+=P(tx-Math.sin(a*D)*L,ty+Math.cos(a*D)*L,a,{L,w:24+rnd()*6,b:R(8),l:24+rnd()*12})}
 for(const t of[.2,.4,.62,.8]){const[bx,by]=Bq(t);g2+=hilt(X(bx)-q*5,by+4,q<0?150+R(30):210+R(30),.65)}
 g2+=`<clipPath id="${id}"><path d="${dd}"/></clipPath><path d="${dd}" fill="#0b0c0e"/><g clip-path="url(#${id})">`;
 for(let i=0;i<24;i++){const[cx,cy]=pt2(),a=rnd()<.5?180-q*(41+R(28))+(rnd()<.5?180:0):(rnd()<.5?90:270)+R(100),L=150+rnd()*100;pl.push([cy,P(X(cx)-Math.sin(a*D)*L/2,cy+Math.cos(a*D)*L/2,a,{L,w:22+rnd()*12,b:R(10),l:20+rnd()*16})])}
 g2+=pl.sort((m,z)=>m[0]-z[0]).map(m=>m[1]).join('')+'</g>'}

// seat: vertical slats, seat bar, crossing diagonals, tall armrest panels
for(let i=0;i<10;i++)g2+=P(301+i*22,752,180,{L:104+R(8),w:23.5,b:0,l:(i%2?36:44)+rnd()*4,h:212,s:8});
g2+=`<rect x="290" y="735" width="220" height="20" rx="2" fill="url(#ledge)" stroke="#07080a"/><path d="M292 736H508" stroke="#c4ced6" stroke-width="1.3" opacity=".5"/>`;
g2+=P(286,856,68,{L:225,w:15,b:0,l:44,h:212,s:8})+P(514,856,-68,{L:225,w:15,b:0,l:40,h:212,s:8});
g2+=arm(268,26,676,858)+arm(506,26,676,858)+hilt(244,706,172,.8)+hilt(556,706,188,.8);


s+=`<g filter="url(#tx)">${g2}</g>`;
// Foreground columns are lowered slightly and painted last so they overlap the platform edges.
s+=`<g id="foreground-pillars" transform="translate(0 115)">${PILLARS}</g>`;
// ---- light and vignette ----


document.getElementById('g').innerHTML=s;
// animated light layer (separate svg so the textured throne is never repainted)
{let DS='';for(let i=0;i<40;i++)DS+=`<circle class="dm" cx="${f(250+MR()*330)}" cy="${f(-20+MR()*760)}" r="${f(.7+MR()*1.4)}" style="--dx:${f((MR()-.5)*70)}px;--dy:${f((MR()-.3)*60)}px;animation-duration:${f(16+MR()*18)}s;animation-delay:-${f(MR()*30)}s"/>`;
document.getElementById('og').innerHTML=`<g id="hall-torch-glow">${GG}</g>`+`${BEAMS}<g class="hz"><ellipse cx="300" cy="700" rx="700" ry="70" fill="url(#hzg)"/><ellipse cx="560" cy="820" rx="800" ry="60" fill="url(#hzg)"/><ellipse cx="400" cy="600" rx="900" ry="90" fill="url(#hzg)"/></g><g id="hall-torches">${GF}</g>`+DS+`<rect x="-1100" y="-400" width="3000" height="1500" filter="url(#grain)" opacity=".13" style="mix-blend-mode:overlay"/>`+[[sceneLeft,-100],[sceneRight,-100],[sceneLeft,1000],[sceneRight,1000]].map(([x,y])=>`<ellipse cx="${f(x)}" cy="${y}" rx="${f(sceneW*.36)}" ry="500" fill="url(#corner)"/>`).join('')+`<rect x="-3000" y="-2000" width="6600" height="4400" fill="url(#vg2)"/>`+
 `<g id="hall-window-light" transform="translate(0 -145)"><path d="${WIN}" fill="#ffffff" opacity=".7" filter="url(#bl2)" style="mix-blend-mode:screen"/><path d="${WIN}" fill="url(#skyB)"/><path d="M345 -540V70M400 -540V70M455 -540V70M290 -70H510M290 -230H510" stroke="#0a0d10" stroke-width="7"/><path d="${WIN}" fill="none" stroke="#0a0d10" stroke-width="12" stroke-linejoin="round"/><rect x="252" y="68" width="296" height="26" fill="#1b2127" stroke="#000"/><rect x="252" y="68" width="296" height="3" fill="#e8f2f9" opacity=".7"/></g>`+
 `<ellipse cx="400" cy="-66" rx="340" ry="80" fill="url(#dayGlow)" style="mix-blend-mode:screen"/>`}
bindSwords();
}

const n=document.getElementById('n'),w=document.getElementById('w'),hint=document.getElementById('hint'),root=document.documentElement;
const confirmHouse=document.getElementById('confirmHouse');
const modePinPanel=document.getElementById('modePinPanel'),modePinInput=document.getElementById('modePinInput'),pinError=document.getElementById('pinError');
const inFrame=window.parent!==window;
let picked=-1;
let previewed=-1;
const setHint=(t,warn)=>{hint.textContent=t;hint.classList.toggle('warn',!!warn)};
if(isPhone())setHint('Tap a sword to preview');
if(entryMode){n.textContent='War of Westeros';w.textContent='Choose your path';setHint(isPhone()?'Tap a sword to preview':'Choose a sword to host or join')}
const show=i=>{const h=H[i],choice=entryMode?ENTRY_CHOICES[i]:null;n.textContent=choice?.name||h.name;w.textContent=choice?.motto||h.motto;root.style.setProperty('--c',h.color);
 if(entryMode&&choice)setHint(choice.mode==='host'?'Click to host a game':'Click to join a game');
 else if(h.status!=='open')setHint(h.note||'Not available',true);else setHint(h.note?`${h.note} · click to choose`:'Click to choose this house')};
const reset=()=>{if(picked>=0)return show(picked);if(previewed>=0){const h=H[previewed],choice=entryMode?ENTRY_CHOICES[previewed]:null;n.textContent=choice?.name||h.name;w.textContent=choice?.motto||h.motto;root.style.setProperty('--c',h.color);setHint(entryMode?'Tap again or confirm your choice':'Tap again or confirm your house');return}n.textContent='War of Westeros';w.textContent=entryMode?'Choose your path':'Choose your house';setHint(entryMode?(isPhone()?'Tap a sword to preview':'Choose a sword to host or join'):(isPhone()?'Tap a sword to preview':'Click a sword to swear fealty'));root.style.setProperty('--c','#aeb4b9');confirmHouse.hidden=true};
function transitionMode(mode){
 const nextEntry=mode==='entry';
 if(entryMode===nextEntry)return;
 document.body.classList.add('mode-switching');
 setTimeout(()=>{
  entryMode=nextEntry;picked=-1;previewed=-1;confirmHouse.hidden=true;modePinPanel.hidden=true;pinError.textContent='';
  confirmHouse.textContent=entryMode?'Confirm choice':'Confirm house';
  applyStatus();reset();
  requestAnimationFrame(()=>document.body.classList.remove('mode-switching'));
 },160);
}
function pick(i){
 const h=H[i];
 if(entryMode){
  const choice=ENTRY_CHOICES[i];if(!choice)return;
  picked=i;previewed=-1;applyStatus();show(i);
  if(choice.mode==='host'){confirmHouse.hidden=true;setHint('Opening a new game…');if(inFrame)window.parent.postMessage({type:'iron-throne:host'},location.origin==='null'?'*':location.origin)}
  else{confirmHouse.hidden=true;setHint('Enter the PIN shared by the host');modePinPanel.hidden=false;pinError.textContent='';modePinInput.value='';setTimeout(()=>modePinInput.focus(),30)}
  return;
 }
 if(h.status!=='open'){show(i);setHint(h.note||'Not available',true);return}
 picked=i;previewed=-1;confirmHouse.hidden=true;applyStatus();show(i);setHint('Sworn. Now give your name…');
 // The game page (same site) listens for this and moves on to the name screen.
 if(inFrame)window.parent.postMessage({type:'iron-throne:pick',house:h.key,name:h.name},location.origin==='null'?'*':location.origin);
 // Opened by itself (not inside the game page): continue to the game's name screen.
 else setTimeout(()=>{location.href='./index.html#house='+encodeURIComponent(h.key)},700);
}
function applyStatus(){document.querySelectorAll('.sw').forEach(e=>{const i=+e.dataset.i,disabled=entryMode?!ENTRY_CHOICES[i]:H[i].status!=='open';e.classList.toggle('locked',disabled);e.classList.toggle('mode-inactive',entryMode&&!ENTRY_CHOICES[i]);e.classList.toggle('picked',i===picked);e.classList.toggle('preview',i===previewed);e.setAttribute('aria-disabled',disabled)})}
function bindSwords(){document.querySelectorAll('.sw').forEach(e=>{const i=+e.dataset.i,preview=()=>{if(entryMode&&!ENTRY_CHOICES[i])return;show(i)};
 e.addEventListener('pointerenter',preview);e.addEventListener('pointerleave',reset);e.addEventListener('focus',preview);e.addEventListener('blur',reset);
 e.addEventListener('click',()=>{
  if(entryMode&&!ENTRY_CHOICES[i])return;
  if(!isPhone()){pick(i);return}
  if(entryMode){if(previewed===i){pick(i);return}previewed=i;applyStatus();show(i);setHint('Tap again or confirm your choice');confirmHouse.hidden=false;return}
  if(H[i].status!=='open'){previewed=-1;confirmHouse.hidden=true;applyStatus();show(i);setHint(H[i].note||'Not available',true);return}
  if(previewed===i){pick(i);return}
  previewed=i;applyStatus();show(i);setHint('Tap again or confirm your house');confirmHouse.hidden=false;
 });e.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pick(i)}})});applyStatus()}
confirmHouse.textContent=entryMode?'Confirm choice':'Confirm house';
confirmHouse.addEventListener('click',()=>{if(previewed>=0)pick(previewed)});
modePinInput.addEventListener('input',()=>{modePinInput.value=modePinInput.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);pinError.textContent=''});
modePinPanel.addEventListener('submit',event=>{event.preventDefault();const pin=modePinInput.value.trim().toUpperCase();if(pin.length!==4){pinError.textContent='Enter all four characters.';return}if(inFrame)window.parent.postMessage({type:'iron-throne:join-pin',pin},location.origin==='null'?'*':location.origin)});
document.getElementById('cancelPin').addEventListener('click',()=>{modePinPanel.hidden=true;picked=-1;applyStatus();reset()});
// Live house data from the game page: [{name,motto,color,status:'open'|'locked'|'claimed',note}]
addEventListener('message',ev=>{
 if(ev.source!==window.parent||!ev.data)return;
 if(ev.data.type==='iron-throne:set-mode'&&['entry','house'].includes(ev.data.mode))transitionMode(ev.data.mode);
 if(ev.data.type==='iron-throne:mode-error'){const message=String(ev.data.message||'Could not continue.');pinError.textContent=message;setHint(modePinPanel.hidden?message:'Choose a sword to try again',true)}
 if(ev.data.type==='iron-throne:houses'&&Array.isArray(ev.data.houses)){
  for(const g of ev.data.houses){const h=H.find(x=>x.key===normHouse(g.name)||x.key===normHouse(g.id));if(!h)continue;
   h.id=g.id;if(g.name){const nm=String(g.name).replace(/^house\s+/i,'');h.name='House '+nm.charAt(0).toUpperCase()+nm.slice(1)}if(g.motto)h.motto=String(g.motto);
   if(/^#[0-9a-f]{3,8}$/i.test(g.color||''))h.color=g.color;h.status=['open','locked','claimed'].includes(g.status)?g.status:'open';h.note=String(g.note||'')}
  if(previewed>=0&&H[previewed].status!=='open'){previewed=-1;confirmHouse.hidden=true}
  document.querySelectorAll('.sw').forEach(e=>e.style.setProperty('--c',H[+e.dataset.i].color));applyStatus();
 }
 if(ev.data.type==='iron-throne:reset'){picked=-1;previewed=-1;confirmHouse.hidden=true;modePinPanel.hidden=true;applyStatus();reset()}
});
build();
if(inFrame)window.parent.postMessage({type:'iron-throne:ready'},location.origin==='null'?'*':location.origin);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(build,120)});
</script></body></html>
